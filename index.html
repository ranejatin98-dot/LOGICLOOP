<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUGDNA</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--ink:#14202b;--mut:#5b6b78;--card:#fff;--line:#d3dce3;--teal:#0e8f8a;--mag:#c2185b;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1820;--ink:#e6edf2;--mut:#8fa2b0;--card:#16232d;--line:#2a3b48;--teal:#3cc7c0;--mag:#ff5c97}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
header{padding:28px 0 8px}h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
h1 span{color:var(--teal)}header p{max-width:52ch;color:var(--mut);margin:10px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;margin-top:22px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
label{display:block;font-weight:500;font-size:.9rem;margin:12px 0 4px}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{font-family:'IBM Plex Mono',monospace;font-size:.85rem;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 12px}
button.go{background:var(--teal);border-color:var(--teal);color:#06201f;font-weight:500;width:100%;margin-top:16px;padding:12px}
button:disabled{opacity:.6;cursor:wait}
.samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.samples button{font-size:.8rem;padding:4px 9px}
.dna{display:flex;gap:3px;height:74px;align-items:stretch;margin:12px 0}
.dna i{flex:1;border-radius:3px;animation:in .6s ease backwards}
@keyframes in{from{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){.dna i{animation:none}}
.fid{font-family:'IBM Plex Mono',monospace;font-size:1.25rem;font-weight:500}
.mut{color:var(--mut);font-size:.9rem}.mono{font-family:'IBM Plex Mono',monospace;font-size:.82rem;word-break:break-word}
.stack>*+*{margin-top:14px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.8rem;margin-right:6px}
.hi{border-color:var(--mag);color:var(--mag)}
.sim{padding:10px 0;border-top:1px solid var(--line)}.sim:first-of-type{border-top:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.bar b{display:block;height:100%;background:var(--teal)}
ol{padding-left:20px;margin:6px 0 0}
.err{border-color:var(--mag);color:var(--mag)}
.empty{text-align:center;color:var(--mut);padding:48px 12px}
.hist{margin-top:22px}.hist li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);list-style:none}
.hist ul{padding:0;margin:8px 0 0}
.ai{border-color:var(--teal);box-shadow:0 0 0 1px color-mix(in srgb,var(--teal) 15%,transparent)}
.aihead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.status{font-size:.75rem;border:1px solid var(--teal);color:var(--teal);border-radius:99px;padding:2px 9px}
</style></head><body><div class="wrap">
<header><h1>BUG<span>DNA</span></h1><p>Paste a bug. BUGDNA reads its fingerprint, finds the same failure in past bugs, and tells you what to try first.</p></header>
<div class="grid">
<form class="card" id="f" onsubmit="run(event)">
 <div class="samples"><span class="mut">Try:</span>
  <button type="button" onclick="ex(0)">Python None</button><button type="button" onclick="ex(1)">CORS</button><button type="button" onclick="ex(2)">Memory</button><button type="button" onclick="ex(3)">Race</button></div>
 <label for="title">Title</label><input id="title" placeholder="Checkout page crashes">
 <div class="row"><div><label for="language">Language</label><select id="language"><option>python</option><option>javascript</option><option>java</option><option>typescript</option><option>go</option><option>c++</option><option>other</option></select></div>
 <div><label for="environment">Environment</label><input id="environment" placeholder="Node 20, Ubuntu"></div></div>
 <label for="error_message">Error message</label><textarea id="error_message" rows="3" placeholder="TypeError: Cannot read properties of undefined"></textarea>
 <label for="code">Code (optional)</label><textarea id="code" rows="5"></textarea>
 <label for="description">What happened?</label><textarea id="description" rows="3" style="font-family:inherit"></textarea>
 <button class="go" id="btn">Analyze bug</button>
</form>
<main id="out" class="stack"><div class="card empty">Submit a bug to see its fingerprint, similar cases and a recommended fix.</div></main>
</div>
<section class="card hist"><h3>Recent analyses</h3><ul id="hist"><li class="mut">None yet.</li></ul></section>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EX=[
{title:"Profile page crashes",language:"python",error_message:"AttributeError: 'NoneType' object has no attribute 'name'",code:"user = db.get(uid)\nprint(user.name)",description:"Happens for brand-new accounts only."},
{title:"Frontend cannot call API",language:"javascript",error_message:"Access to fetch blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present",environment:"React on :3000, API on :8000",description:"Works in Postman."},
{title:"Worker dies overnight",language:"python",error_message:"MemoryError: process killed (OOM)",description:"Memory usage grows steadily while processing large CSV files."},
{title:"Order saved twice",language:"javascript",error_message:"Unhandled promise rejection",description:"Intermittent, only when users double click submit. await missing somewhere?"}];
function ex(i){const e=EX[i];['title','language','environment','error_message','code','description'].forEach(k=>$(k).value=e[k]||(k=='language'?'python':''))}
async function run(ev){ev.preventDefault();const b=$('btn');b.disabled=true;b.textContent='Reading the DNA…';
 const body={};['title','language','environment','error_message','code','description'].forEach(k=>body[k]=$(k).value);
 try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();if(!r.ok)throw new Error(d.detail||'Analysis failed');show(d);loadHist()}
 catch(e){$('out').innerHTML=`<div class="card err">${esc(e.message)}. Check that the server is running and try again.</div>`}
 b.disabled=false;b.textContent='Analyze bug'}
function show(d){const o=d.overview,f=d.fingerprint,p=d.pattern,m=d.meta,pct=Math.round(m.confidence*100);
 const ai=d.ai_analysis||{}, aiActive=ai.status==='active';
 const bands=f.bands.map((v,i)=>`<i style="background:${i%2?'var(--teal)':'var(--mag)'};opacity:${.35+v/400};flex:${1+v%3};animation-delay:${i*40}ms"></i>`).join('');
 const aiCause=aiActive&&ai.cause?ai.cause:d.root_cause.hypothesis;
 const aiExplanation=aiActive&&ai.explanation?ai.explanation:'';
 const aiRec=aiActive&&ai.recommendation?ai.recommendation:'';
 const aiSteps=aiActive&&Array.isArray(ai.fix_steps)?ai.fix_steps:[];
 $('out').innerHTML=`
 <div class="card"><div class="mut">Fingerprint</div><div class="dna" aria-hidden="true">${bands}</div>
  <div class="fid">${esc(f.id)}</div><div class="mut">${esc(f.error_type)} · normalized: <span class="mono">${esc(f.signature)||'none'}</span></div></div>
 <div class="card"><h3>${esc(o.title)}</h3><p style="margin:8px 0 0"><span class="tag">${esc(o.language)}</span><span class="tag">${esc(o.category)}</span><span class="tag ${o.severity=='high'?'hi':''}">${o.severity} severity</span></p>
  <p class="mut" style="margin:10px 0 0">Confidence ${pct}%</p><div class="bar"><b style="width:${pct}%"></b></div></div>
 <div class="card ai"><div class="aihead"><h3>Root cause analysis</h3><span class="status">${aiActive?'Gemma 4 · Active':'Gemma 4 · Offline'}</span></div>
  <p><b>${esc(aiCause)}</b></p>
  ${aiExplanation?`<p class="mut">${esc(aiExplanation)}</p>`:''}
  ${aiActive?`<p class="mut">AI confidence ${Math.round((ai.confidence||0)*100)}% · ${esc(ai.model||'Gemma 4')}</p>`:''}</div>
 <div class="card ai"><div class="aihead"><h3>Recommendation</h3><span class="status">${aiActive?'AI-guided':'Deterministic'}</span></div>
  ${aiRec?`<p>${esc(aiRec)}</p>`:''}
  <ol>${(aiSteps.length?aiSteps:d.recommendation.steps).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
 <div class="card"><h3>Recurring pattern</h3><p>${esc(p.summary)}</p><p class="mut">Most common in: ${Object.entries(p.languages).map(([k,v])=>`${esc(k)} (${v})`).join(', ')||'n/a'}</p></div>
 <div class="card"><h3>Similar past bugs</h3>${d.similar_bugs.length?d.similar_bugs.map(s=>`<div class="sim"><b>${esc(s.title)}</b> <span class="mut">${esc(s.id)} · ${esc(s.language)} · ${esc(s.date)}</span>
  <div class="mono">${esc(s.error)}</div><div>Fixed by: ${esc(s.resolution)}</div><div class="bar"><b style="width:${s.similarity}%"></b></div><span class="mut">${s.similarity}% similar</span></div>`).join(''):'<p class="mut">No close matches in the history.</p>'}</div>`;
 if(innerWidth<860)$('out').scrollIntoView({behavior:'smooth'})}
async function loadHist(){try{const h=await (await fetch('/api/history')).json();
 if(h.length)$('hist').innerHTML=h.map(x=>`<li><span>${esc(x.title)}</span><span class="mut mono">${esc(x.fingerprint.id)} · ${Math.round(x.confidence*100)}%</span></li>`).join('')}catch(e){}}
loadHist();
</script></body></html>
